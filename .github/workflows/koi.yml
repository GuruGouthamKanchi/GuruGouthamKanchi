name: Draw Git Koi

on:
  schedule:
    - cron: '5 0 * * *' # Runs daily shortly after midnight UTC
  workflow_dispatch:     # Allows manual trigger from the GitHub Actions tab
  push:
    paths:
      - '.github/workflows/koi.yml'

permissions:
  contents: write

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Koi GIF
        uses: yalongwastaken/git-koi@v1
        with:
          # Body style options: white, black, asagi, tea, gold, platinum (default: white)
          body: gold
          output-dir: koi

      - name: Commit and push changes if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update profile koi GIF" && git push)

